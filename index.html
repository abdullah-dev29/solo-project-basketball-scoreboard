<html>
    <head>
        <title>Basketball Scoreboard</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class="home">
                <h3>HOME</h3>
                <h4 id="home">0</h4>
                <div class="buttons">
                    <button type="button" onclick="homeOne()">+1</button>
                    <button type="button" onclick="homeTwo()">+2</button>
                    <button type="button" onclick="homeThree()">+3</button>
                </div>
            </div>
            <div class="new-game">
                <button type="button" class="new-game" onclick="newGame()">New Game</button>
            </div>
            <div class="guest">
                <h3>AWAY</h3>
                <h4 id="guest">0</h4>
                <div class="buttons">
                    <button type="button" onclick="guestOne()">+1</button>
                    <button type="button" onclick="guestTwo()">+2</button>
                    <button type="button" onclick="guestThree()">+3</button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
